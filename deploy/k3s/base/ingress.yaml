# K3s default ingress: Traefik (installed with K3s).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nestlancer-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  rules:
    - host: api.nestlancer.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: ws-gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
  tls:
    - hosts:
        - api.nestlancer.com
      secretName: nestlancer-api-tls
