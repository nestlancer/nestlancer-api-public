# Copy to secrets.yaml (gitignored) or create via:
#   kubectl create secret generic nestlancer-secrets -n nestlancer \
#     --from-env-file=.env.production
#
# Required keys include DATABASE_URL, REDIS_*, RABBITMQ_*, JWT keys, etc.
# Email worker (ZeptoMail): EMAIL_PROVIDER, ZEPTOMAIL_TOKEN, ZEPTOMAIL_SMTP_HOST or
# ZEPTOMAIL_DC (in|us|eu|…), FROM_EMAIL, FROM_NAME, REPLY_TO, FRONTEND_URL.
# Source of truth: Infisical production environment.
apiVersion: v1
kind: Secret
metadata:
  name: nestlancer-secrets
  namespace: nestlancer
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASS@HOST:5432/nestlancer"
  NODE_ENV: production
