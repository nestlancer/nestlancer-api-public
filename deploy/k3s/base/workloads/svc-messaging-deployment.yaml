apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-messaging
  labels:
    app: svc-messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-messaging
  template:
    metadata:
      labels:
        app: svc-messaging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: svc-messaging
          image: ghcr.io/nestlancer/messaging:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3010
              name: http
            - containerPort: 9464
              name: metrics
          envFrom:
            - secretRef:
                name: nestlancer-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: METRICS_BIND_HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3010"
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
