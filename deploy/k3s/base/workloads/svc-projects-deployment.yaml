apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-projects
  labels:
    app: svc-projects
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-projects
  template:
    metadata:
      labels:
        app: svc-projects
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: svc-projects
          image: ghcr.io/nestlancer/projects:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3008
              name: http
          envFrom:
            - secretRef:
                name: nestlancer-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3008"
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
