apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-document
  labels:
    app: worker-document
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-document
  template:
    metadata:
      labels:
        app: worker-document
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: worker-document
          image: ghcr.io/nestlancer/document-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9464
              name: metrics
          envFrom:
            - secretRef:
                name: nestlancer-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: METRICS_BIND_HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
