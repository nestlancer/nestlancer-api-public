apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nestlancer-local

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: nestlancer-api
    patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          traefik.ingress.kubernetes.io/router.entrypoints: web
      - op: remove
        path: /spec/tls
      - op: replace
        path: /spec/rules/0/host
        value: api.nestlancer.local

images:
  - name: ghcr.io/nestlancer/gateway
    newName: ghcr.io/nestlancer/gateway
    newTag: local
  - name: ghcr.io/nestlancer/ws-gateway
    newName: ghcr.io/nestlancer/ws-gateway
    newTag: local
