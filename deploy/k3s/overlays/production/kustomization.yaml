apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nestlancer

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: nestlancer-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.nestlancer.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.nestlancer.com

# Image overrides (defaults to imageRegistry; set K8S_IMAGE_REGISTRY_OVERRIDE or k8sImageRegistryOverride to customize)
images:
  - name: ghcr.io/nestlancer/gateway
    newName: ghcr.io/nestlancer/gateway
    newTag: latest
  - name: ghcr.io/nestlancer/ws-gateway
