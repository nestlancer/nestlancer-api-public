# ══════════════════════════════════════════════════════════════════════════════
# Nestlancer — Full-Stack Docker Dev Compose (8-core / 24GB Watch Mode)
# ══════════════════════════════════════════════════════════════════════════════
#
# Strategy:
#   • Single shared image  : nestlancer-backend-dev (built from docker/dev.Dockerfile)
#   • Bind-mount source    : entire monorepo root → /app inside every container
#   • Watch mode           : gateways + all microservices watch by default
#   • Infrastructure       : PostgreSQL, Redis, RabbitMQ, Mailpit, S3-compatible storage,
#                            MeiliSearch run on VPS via Tailscale (external)
#   • Resource ceilings    : every container has hard mem/CPU limits (SSH-safe)
#   • Profiles             : default `up` = ALL microservices; workers opt-in
#   • Workers              : compiled by default; watch only when explicitly selected
#   • Batched bring-up     : compose-dev.sh starts up to 4 containers concurrently
#
# Quick Start (8-core / 24GB VPS — SSH-safe):
#   pnpm docker:build
#   pnpm docker:up              # all gateways + all microservices (batched)
#   pnpm docker:up:workers      # remaining workers (batched)
#   WATCH_SERVICES=gateway,svc-auth pnpm docker:up   # focused fallback
#
# Or: bash scripts/docker/compose-dev.sh up -d
#
# Stop:
#   pnpm docker:down:workers    # workers only
#   pnpm docker:down:core       # core only (leave workers)
#   pnpm docker:down            # everything
#
# Rebuild after pnpm install changes: pnpm docker:build:nocache
# ══════════════════════════════════════════════════════════════════════════════

# ── Resource class templates (Compose v2 enforces deploy.resources + legacy keys) ──
x-limits-gateway: &limits-gateway
  mem_limit: 1280m
  memswap_limit: 1280m
  cpus: 1.00
  deploy:
    resources:
      limits:
        cpus: '1.00'
        memory: 1280M
      reservations:
        cpus: '0.20'
        memory: 320M

x-limits-svc: &limits-svc
  mem_limit: 1280m
  memswap_limit: 1280m
  cpus: 0.75
  deploy:
    resources:
      limits:
        cpus: '0.75'
        memory: 1280M
      reservations:
        cpus: '0.10'
        memory: 256M

x-limits-light: &limits-light
  mem_limit: 1280m
  memswap_limit: 1280m
  cpus: 0.75
  deploy:
    resources:
      limits:
        cpus: '0.75'
        memory: 1280M
      reservations:
        cpus: '0.10'
        memory: 256M

x-limits-worker: &limits-worker
  mem_limit: 768m
  memswap_limit: 768m
  cpus: 0.40
  deploy:
    resources:
      limits:
        cpus: '0.40'
        memory: 768M
      reservations:
        cpus: '0.05'
        memory: 128M

x-limits-pdf: &limits-pdf
  mem_limit: 1280m
  memswap_limit: 1280m
  cpus: 0.85
  deploy:
    resources:
      limits:
        cpus: '0.85'
        memory: 1280M
      reservations:
        cpus: '0.15'
        memory: 320M

x-limits-sidecar: &limits-sidecar
  mem_limit: 128m
  memswap_limit: 128m
  cpus: 0.20
  deploy:
    resources:
      limits:
        cpus: '0.20'
        memory: 128M
      reservations:
        cpus: '0.05'
        memory: 32M

# ── Shared service template ─────────────────────────────────────────────────
x-dev-service: &dev-service
  image: nestlancer-backend-dev:latest
  # Local-only image — never pull from Docker Hub (avoids "pull access denied" noise).
  # Build via: pnpm docker:build  (or compose-dev.sh, which builds once before up).
  pull_policy: never
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  # Generated by scripts/docker/compose-dev.sh (infisical export --env=dev)
  env_file:
    - .env.infisical
  volumes:
    # Bind-mount entire monorepo — source changes trigger NestJS watch reload
    - .:/app
    # NAMED shared volumes (not anonymous): copy image node_modules once, reuse
    # across all containers. Anonymous mounts re-copy ~GB per container on create
    # and make `docker:up:full` disk-bound for many minutes at low CPU.
    # IMPORTANT: pre-warm via compose-dev.sh (single container) — parallel creates
    # race on pnpm symlinks ("file exists") when many services start at once.
    - nl_nm_root:/app/node_modules
    - nl_nm_gateway:/app/gateway/node_modules
    - nl_nm_ws_gateway:/app/ws-gateway/node_modules
    - nl_nm_svc_admin:/app/services/admin/node_modules
    - nl_nm_svc_auth:/app/services/auth/node_modules
    - nl_nm_svc_blog:/app/services/blog/node_modules
    - nl_nm_svc_contact:/app/services/contact/node_modules
    - nl_nm_svc_health:/app/services/health/node_modules
    - nl_nm_svc_media:/app/services/media/node_modules
    - nl_nm_svc_messaging:/app/services/messaging/node_modules
    - nl_nm_svc_notifications:/app/services/notifications/node_modules
    - nl_nm_svc_payments:/app/services/payments/node_modules
    - nl_nm_svc_portfolio:/app/services/portfolio/node_modules
    - nl_nm_svc_progress:/app/services/progress/node_modules
    - nl_nm_svc_projects:/app/services/projects/node_modules
    - nl_nm_svc_quotes:/app/services/quotes/node_modules
    - nl_nm_svc_requests:/app/services/requests/node_modules
    - nl_nm_svc_users:/app/services/users/node_modules
    - nl_nm_svc_webhooks:/app/services/webhooks/node_modules
    - nl_nm_worker_analytics:/app/workers/analytics-worker/node_modules
    - nl_nm_worker_audit:/app/workers/audit-worker/node_modules
    - nl_nm_worker_cdn:/app/workers/cdn-worker/node_modules
    - nl_nm_worker_email:/app/workers/email-worker/node_modules
    - nl_nm_worker_media:/app/workers/media-worker/node_modules
    - nl_nm_worker_notification:/app/workers/notification-worker/node_modules
    - nl_nm_worker_outbox:/app/workers/outbox-poller/node_modules
    - nl_nm_worker_webhook:/app/workers/webhook-worker/node_modules
    - nl_nm_worker_document:/app/workers/document-worker/node_modules
    - nl_nm_worker_export:/app/workers/export-worker/node_modules
    - nl_prisma_generated:/app/prisma/generated
  extra_hosts:
    # Allows containers to reach services on the Docker host (and via Tailscale)
    - 'host.docker.internal:host-gateway'
  environment:
    PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    METRICS_ENABLED: 'true'
    METRICS_PORT: '9464'
    METRICS_BIND_HOST: '0.0.0.0'
    TRACING_ENABLED: '${TRACING_ENABLED:-false}'
    NODE_OPTIONS: '--max-old-space-size=896'
    WATCH_SERVICES: '${WATCH_SERVICES:-all-services}'
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
  networks:
    - nestlancer-dev
  restart: unless-stopped

# ── Network ─────────────────────────────────────────────────────────────────
networks:
  nestlancer-dev:
    name: nestlancer-dev
    driver: bridge

# ══════════════════════════════════════════════════════════════════════════════
# Services
# Default `docker compose up -d` starts ALL microservices (no profile).
# Workers require COMPOSE_PROFILES=workers (pnpm docker:up:workers).
# ══════════════════════════════════════════════════════════════════════════════
services:
  # ── HTTP API Gateway (port 3000) — core ──────────────────────────────────
  gateway:
    <<: [*limits-gateway, *dev-service]
    container_name: nl-gateway
    command: >
      sh -c "cd /app && sh scripts/docker/run-nest-workload.sh gateway @nestlancer/gateway gateway"
    environment:
      AUTH_SERVICE_URL: http://nl-svc-auth:3001
      USERS_SERVICE_URL: http://nl-svc-users:3002
      PAYMENTS_SERVICE_URL: http://nl-svc-payments:3003
      WEBHOOKS_SERVICE_URL: http://nl-svc-webhooks:3004
      ADMIN_SERVICE_URL: http://nl-svc-admin:3005
      REQUESTS_SERVICE_URL: http://nl-svc-requests:3006
      QUOTES_SERVICE_URL: http://nl-svc-quotes:3007
      PROJECTS_SERVICE_URL: http://nl-svc-projects:3008
      PROGRESS_SERVICE_URL: http://nl-svc-progress:3009
      MESSAGING_SERVICE_URL: http://nl-svc-messaging:3010
      NOTIFICATIONS_SERVICE_URL: http://nl-svc-notifications:3011
      MEDIA_SERVICE_URL: http://nl-svc-media:3012
      PORTFOLIO_SERVICE_URL: http://nl-svc-portfolio:3013
      BLOG_SERVICE_URL: http://nl-svc-blog:3014
      CONTACT_SERVICE_URL: http://nl-svc-contact:3015
      HEALTH_SERVICE_URL: http://nl-svc-health:3016
      OTEL_SERVICE_NAME: nl-gateway
      NODE_OPTIONS: '--max-old-space-size=768'
      WATCH_SERVICES: '${WATCH_SERVICES:-all-services}'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      METRICS_ENABLED: 'true'
      METRICS_PORT: '9464'
      METRICS_BIND_HOST: '0.0.0.0'
      TRACING_ENABLED: '${TRACING_ENABLED:-false}'
    ports:
      - '3000:3000'
      - '${METRICS_BIND_HOST:-0.0.0.0}:13000:9464'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health/live']
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  # ── WebSocket Gateway (port 3100) — core ─────────────────────────────────
