    <<: [*limits-gateway, *dev-service]
    container_name: nl-ws-gateway
    command: >
      sh -c "cd /app && sh scripts/docker/run-nest-workload.sh ws-gateway @nestlancer/ws-gateway gateway"
    environment:
      OTEL_SERVICE_NAME: nl-ws-gateway
