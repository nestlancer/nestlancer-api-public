      BLOG_SERVICE_URL: http://svc-blog:3014
      CONTACT_SERVICE_URL: http://svc-contact:3015
      HEALTH_SERVICE_URL: http://svc-health:3016
    ports:
      - '4000:3000'
      - '${METRICS_BIND_HOST:-0.0.0.0}:23000:9464'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health/live']
