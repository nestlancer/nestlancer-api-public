  # ── Promtail (App VPS sidecar — ships nl-* logs → Loki on Infra VPS) ─────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: nl-prod-promtail
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.20
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    env_file:
      - .env.infisical
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://100.115.123.41:3100/loki/api/v1/push}
      OBSERVABILITY_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/tmp/promtail
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo >/dev/tcp/127.0.0.1/9080"']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    networks:
      - nestlancer-prod
    restart: unless-stopped

volumes:
  promtail-positions:

